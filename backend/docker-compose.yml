services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: falcon_rider
      POSTGRES_USER: falcon
      POSTGRES_PASSWORD: falcon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcon -d falcon_rider"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: docker-dev-secret-change-me
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SETTINGS_MODULE: falcon_rider.settings.development
      DB_NAME: falcon_rider
      DB_USER: falcon
      DB_PASSWORD: falcon
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:19006
      DEFAULT_FROM_EMAIL: noreply@falconrider.local
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      PAYMENT_WEBHOOK_SECRET: dev-webhook-secret
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - media_data:/app/media

  celery_worker:
    build: .
    command: celery -A falcon_rider worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: falcon_rider.settings.development
      DB_NAME: falcon_rider
      DB_USER: falcon
      DB_PASSWORD: falcon
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  celery_beat:
    build: .
    command: celery -A falcon_rider beat -l info
    environment:
      DJANGO_SETTINGS_MODULE: falcon_rider.settings.development
      DB_NAME: falcon_rider
      DB_USER: falcon
      DB_PASSWORD: falcon
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

volumes:
  postgres_data:
  media_data:
