<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="falconGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#25D366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#128C7E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="falconWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8F5E9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <rect x="0" y="0" width="200" height="200" rx="40" fill="url(#falconGreen)" />

  <!-- Falcon body - green -->
  <path d="M 100 40
           C 120 40, 140 55, 145 80
           C 150 105, 140 130, 120 145
           C 110 152, 100 155, 100 155
           C 100 155, 90 152, 80 145
           C 60 130, 50 105, 55 80
           C 60 55, 80 40, 100 40 Z"
        fill="url(#falconWhite)" />

  <!-- Falcon wing - darker green -->
  <path d="M 70 80
           C 60 90, 55 110, 65 130
           C 70 140, 80 148, 90 152
           C 85 140, 82 120, 85 100
           C 87 90, 80 85, 70 80 Z"
        fill="#128C7E" />

  <!-- Falcon wing - white -->
  <path d="M 130 80
           C 140 90, 145 110, 135 130
           C 130 140, 120 148, 110 152
           C 115 140, 118 120, 115 100
           C 113 90, 120 85, 130 80 Z"
        fill="url(#falconWhite)" />

  <!-- Falcon eye -->
  <circle cx="100" cy="75" r="6" fill="#128C7E" />
  <circle cx="102" cy="73" r="2" fill="#FFFFFF" />

  <!-- Falcon beak -->
  <path d="M 100 80 L 95 90 L 105 90 Z" fill="#FFB300" />

  <!-- Text FALCON RIDER -->
  <text x="100" y="180"
        font-family="Arial, sans-serif"
        font-size="14"
        font-weight="bold"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="2">FALCON RIDER</text>
</svg>
